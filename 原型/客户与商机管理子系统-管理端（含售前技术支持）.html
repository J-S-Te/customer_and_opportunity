<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户与商机管理子系统 - 管理端（含售前技术支持模块）</title>
<style>
/* ========== CSS Design Tokens（宿主 CRM 管理端设计系统） ========== */
:root {
  --primary: #2563EB;
  --primary-light: #3B82F6;
  --primary-bg: #EFF6FF;
  --secondary: #3B82F6;
  --accent: #059669;
  --accent-bg: #ECFDF5;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --card-border: #E4ECFC;
  --sidebar: #0F172A;
  --sidebar-active: #1E3A5F;
  --sidebar-hover: #1E293B;
  --text: #0F172A;
  --text-secondary: #475569;
  --text-muted: #64748B;
  --text-placeholder: #94A3B8;
  --border: #E4ECFC;
  --input-bg: #F1F5FD;
  --danger: #DC2626;
  --danger-bg: #FEF2F2;
  --warning: #F59E0B;
  --warning-bg: #FEF3C7;
  --purple: #8B5CF6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 2px 6px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 20px rgba(0,0,0,0.08);
  --radius-sm: 6px;
  --radius: 8px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --font-heading: 'Lexend', 'PingFang SC', sans-serif;
  --font-body: 'Source Sans 3', 'PingFang SC', sans-serif;
  --font-mono: 'Lexend', 'JetBrains Mono', monospace;
}

@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap');

/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
a { color: var(--primary); text-decoration: none; }
button { cursor: pointer; border: none; outline: none; font-family: inherit; }

/* ========== Layout ========== */
.app { display: flex; height: 100vh; overflow: hidden; }
.app.portal-mode { flex-direction: column; }

/* Sidebar */
.sidebar { width: 240px; min-width: 240px; background: var(--sidebar); display: flex; flex-direction: column; padding: 24px 16px; gap: 6px; }
.sidebar-logo { display: flex; align-items: center; gap: 12px; padding: 4px 8px; margin-bottom: 20px; }
.sidebar-logo-icon { width: 36px; height: 36px; background: var(--primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px; font-family: var(--font-heading); }
.sidebar-logo-text { color: #fff; font-family: var(--font-heading); font-weight: 700; font-size: 16px; }
.sidebar-divider { height: 1px; background: var(--sidebar-hover); margin: 4px 0 12px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius); color: var(--text-placeholder); font-size: 14px; cursor: pointer; transition: all 0.15s; position: relative; }
.nav-item:hover { background: var(--sidebar-hover); color: #CBD5E1; }
.nav-item.active { background: var(--sidebar-active); color: #E2E8F0; font-weight: 600; }
.nav-item .nav-dot { width: 20px; height: 20px; border-radius: 4px; background: #475569; }
.nav-item.active .nav-dot { background: var(--primary-light); }
.nav-item .nav-badge { margin-left: auto; padding: 2px 8px; border-radius: 10px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 600; min-width: 22px; text-align: center; }
.nav-group-label { color: var(--text-placeholder); font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 14px 12px 4px; opacity: 0.7; }

/* Main Content */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.header { height: 56px; min-height: 56px; background: var(--card); display: flex; align-items: center; padding: 0 28px; gap: 16px; box-shadow: var(--shadow-sm); z-index: 10; }
.header-title { font-family: var(--font-heading); font-weight: 700; font-size: 18px; }
.header-breadcrumb { color: var(--text-muted); font-size: 13px; }
.header-spacer { flex: 1; }
.content { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 20px; }

/* Portal Top Nav */
.portal-nav { height: 56px; min-height: 56px; background: var(--card); display: flex; align-items: center; padding: 0 20px; gap: 32px; box-shadow: var(--shadow-sm); z-index: 10; }
.portal-nav-logo { display: flex; align-items: center; gap: 10px; }
.portal-nav-links { display: flex; gap: 24px; }
.portal-nav-links a { color: var(--text-muted); font-size: 14px; cursor: pointer; }
.portal-nav-links a.active { color: var(--primary); font-weight: 600; }
.portal-nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.portal-content { flex: 1; overflow-y: auto; }

/* ========== Components ========== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 600; transition: all 0.15s; white-space: nowrap; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #1D4ED8; }
.btn-secondary { background: var(--input-bg); color: var(--text-secondary); }
.btn-secondary:hover { background: #E2E8F0; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #B91C1C; }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-lg { padding: 10px 20px; font-size: 15px; }

.badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-success { background: var(--accent-bg); color: var(--accent); }
.badge-info { background: var(--primary-bg); color: var(--primary); }
.badge-warning { background: var(--warning-bg); color: #D97706; }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-gray { background: #F1F5F9; color: var(--text-placeholder); }
.badge-purple { background: #F5F3FF; color: var(--purple); }

.card { background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--card-border); }
.card-body { padding: 24px; }
.card-title { font-family: var(--font-heading); font-weight: 700; font-size: 15px; margin-bottom: 14px; }

.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat-card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.stat-card .stat-label { font-size: 12px; color: var(--text-muted); }
.stat-card .stat-value { font-family: var(--font-heading); font-size: 28px; font-weight: 700; }
.stat-card .stat-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.stat-trend.up { background: var(--accent-bg); color: var(--accent); }
.stat-trend.stable { background: var(--primary-bg); color: var(--primary); }

.filter-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-md); }
.filter-input { flex: 1; display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--input-bg); border-radius: var(--radius-sm); }
.filter-input input { border: none; outline: none; background: transparent; font-size: 13px; width: 100%; color: var(--text); }
.filter-input input::placeholder { color: var(--text-placeholder); }
.filter-select { display: flex; align-items: center; gap: 6px; padding: 7px 10px; background: var(--input-bg); border-radius: var(--radius-sm); font-size: 13px; color: var(--text-secondary); cursor: pointer; }
.filter-select .arrow { width: 12px; height: 12px; background: var(--text-placeholder); border-radius: 2px; }

.table-wrap { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-lg); overflow: hidden; }
.table-header { display: flex; background: var(--bg); border-bottom: 1px solid var(--card-border); font-size: 12px; font-weight: 600; color: var(--text-muted); }
.table-row { display: flex; border-bottom: 1px solid var(--card-border); align-items: center; transition: background 0.1s; }
.table-row:last-child { border-bottom: none; }
.table-row:hover { background: #FAFBFC; }
.table-row.alt { background: #FAFBFC; }
.table-row.warn { background: #FFF7ED; }
.tc { padding: 12px; display: flex; align-items: center; }
.tc-link { color: var(--primary); cursor: pointer; }
.tc-link:hover { text-decoration: underline; }

.pagination { display: flex; align-items: center; justify-content: center; padding: 14px; color: var(--text-muted); font-size: 13px; }

.kanban { display: flex; gap: 14px; overflow-x: auto; flex: 1; padding: 4px 0; }
.kanban-col { flex: 1; min-width: 200px; background: var(--input-bg); border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.kanban-col-header { display: flex; align-items: center; gap: 8px; }
.kanban-col-dot { width: 8px; height: 8px; border-radius: 50%; }
.kanban-col-title { font-size: 14px; font-weight: 700; color: var(--text-secondary); }
.kanban-col-count { margin-left: auto; width: 24px; height: 24px; border-radius: 6px; background: #E2E8F0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-muted); }
.kanban-card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-md); cursor: pointer; }
.kanban-card:hover { border-color: var(--primary-light); background: #FAFBFC; }
.kc-name { font-size: 13px; font-weight: 600; }
.kc-customer { font-size: 11px; color: var(--text-muted); }
.kc-row { display: flex; align-items: center; justify-content: space-between; }
.kc-amount { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--primary); }
.kc-date { font-size: 11px; color: var(--text-placeholder); }
.kc-owner { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
.kc-avatar { width: 20px; height: 20px; border-radius: 50%; }
.kc-terminal { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.kc-terminal.win { background: #ECFDF5; color: #059669; }
.kc-terminal.lose { background: #FEF2F2; color: #DC2626; }
.kc-qb { margin-top: 6px; font-size: 11px; color: var(--text-muted); }
.kc-qb b { color: var(--primary); font-weight: 600; }
.kanban-col.terminal { background: linear-gradient(180deg,#F8FAFC,#EEF2F7); border: 1px dashed #CBD5E1; }
.kanban-col.terminal.win { border-color: #6EE7B7; }
.kanban-col.terminal.lose { border-color: #FCA5A5; }

/* ===== V2.1 阶段推进弹窗 / 合同查询 ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
.modal-box { width: 460px; max-width: 100%; background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
.modal-head { padding: 18px 20px; border-bottom: 1px solid var(--card-border); font-size: 15px; font-weight: 700; display:flex; align-items:center; justify-content:space-between; }
.modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; max-height: 60vh; overflow-y: auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--card-border); display: flex; justify-content: flex-end; gap: 10px; }
.form-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); display:flex; align-items:center; gap:6px; }
.req-star { color: var(--danger); }
.field-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.field-error { font-size: 12px; color: var(--danger); margin-top: 6px; display: none; }
.field-error.show { display: block; }
.stage-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.stage-pill { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--card-border); font-size: 12px; cursor: pointer; background: var(--card); color: var(--text-secondary); }
.stage-pill.active { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); font-weight: 700; }
.stage-pill.terminal { border-style: dashed; }
.stage-pill.terminal.win.active { border-color: #059669; background: #ECFDF5; color: #059669; }
.stage-pill.terminal.lose.active { border-color: #DC2626; background: #FEF2F2; color: #DC2626; }
.modal-input, .modal-select, .modal-textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--card-border); border-radius: var(--radius); font-size: 13px; font-family: var(--font-base); background: var(--input-bg); color: var(--text-secondary); box-sizing: border-box; }
.modal-textarea { resize: vertical; min-height: 64px; }
.contract-list { display: flex; flex-direction: column; gap: 8px; }
.contract-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--card-border); border-radius: var(--radius); cursor: pointer; }
.contract-item:hover { border-color: var(--primary-light); }
.contract-item.active { border-color: var(--primary); background: var(--primary-bg); }
.contract-item .ci-name { font-weight: 600; font-size: 13px; }
.contract-item .ci-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.contract-item .ci-check { margin-left: auto; color: var(--primary); font-weight: 700; opacity: 0; }
.contract-item.active .ci-check { opacity: 1; }
.req-banner { font-size: 12px; padding: 8px 12px; border-radius: 8px; background: #FFF7ED; color: #C2410C; }
.req-banner.ok { background: #ECFDF5; color: #047857; }

.overview-card { display: flex; gap: 32px; padding: 20px 24px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-lg); }
.ov-item { display: flex; flex-direction: column; gap: 4px; }
.ov-label { font-size: 11px; color: var(--text-placeholder); }
.ov-value { font-size: 14px; font-weight: 600; }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--card-border); margin-bottom: -1px; }
.tab-item { padding: 10px 16px; font-size: 14px; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab-item.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* Detail Page Layout */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.detail-section { display: flex; flex-direction: column; gap: 14px; }
.detail-label { font-size: 13px; color: var(--text-muted); }
.detail-value { font-size: 14px; font-weight: 500; }

.follow-record { display: flex; gap: 12px; padding: 14px; background: #FAFBFC; border-radius: var(--radius); }
.follow-timeline { width: 2px; background: var(--primary); }
.follow-content { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.follow-head { display: flex; align-items: center; gap: 8px; }
.follow-date { font-size: 11px; color: var(--text-muted); }

.contact-row { display: flex; align-items: center; gap: 14px; padding: 14px; background: #FAFBFC; border-radius: var(--radius); }

.progress-bar-wrap { display: flex; align-items: center; padding: 16px 20px; gap: 0; }
.progress-step { flex: 1; display: flex; align-items: center; gap: 8px; }
.progress-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.progress-dot.done { background: var(--accent); color: #fff; }
.progress-dot.current { background: var(--primary); color: #fff; }
.progress-dot.pending { background: #E4ECFC; color: var(--text-placeholder); }
.progress-line { flex: 1; height: 2px; }
.progress-line.done { background: var(--accent); }
.progress-line.pending { background: #E4ECFC; }

.approval-node { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: var(--radius); background: var(--accent-bg); }
.approval-check { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; min-width: 28px; }
.approval-check.wait { background: var(--warning); }
.approval-check.reject { background: var(--danger); }
.approval-info { flex: 1; }
.approval-info .ai-title { font-size: 13px; font-weight: 600; }
.approval-info .ai-meta { font-size: 11px; color: var(--text-muted); }

/* Portal Pages */
.login-page { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg); }
.login-card { width: 420px; background: var(--card); border-radius: var(--radius-xl); padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 24px; box-shadow: var(--shadow-lg); border: 1px solid var(--card-border); }
.login-card .login-logo { width: 48px; height: 48px; background: var(--primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 22px; }
.login-card h2 { font-family: var(--font-heading); font-size: 24px; }
.login-card .login-sub { color: var(--text-muted); font-size: 14px; }
.login-form { width: 100%; display: flex; flex-direction: column; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
.form-group input, .form-group select, .form-group textarea { padding: 10px 12px; border: 1px solid var(--card-border); border-radius: var(--radius); background: var(--bg); font-size: 14px; font-family: inherit; color: var(--text); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-row { display: flex; gap: 16px; }
.form-row > * { flex: 1; }
.req-star { color: var(--danger); }

.portal-sidebar { width: 280px; display: flex; flex-direction: column; gap: 10px; }
.portal-sidebar .action-btn { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--radius); background: #FAFBFC; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-secondary); transition: all 0.15s; }
.portal-sidebar .action-btn:hover { background: var(--primary-bg); color: var(--primary); }
.action-dot { width: 20px; height: 20px; border-radius: 4px; }

/* Step Wizard */
.step-wizard { display: flex; align-items: center; gap: 0; margin-bottom: 24px; }
.step-item { flex: 1; display: flex; align-items: center; gap: 8px; }
.step-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.step-dot.active { background: var(--primary); color: #fff; }
.step-dot.inactive { background: #E4ECFC; color: var(--text-placeholder); }
.step-line { flex: 1; height: 2px; }
.step-line.active { background: var(--primary); }
.step-line.inactive { background: #E4ECFC; }

/* Grade Matrix */
.matrix-table { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-size: 13px; background: #fff; }
.matrix-table th, .matrix-table td { border: 1px solid var(--border); padding: 8px 6px; text-align: center; }
.matrix-table th { background: var(--input-bg); font-weight: 600; color: var(--text); }
.matrix-cell { cursor: pointer; transition: background .15s; }
.matrix-cell:hover { background: #eef4fb; }
.matrix-cell.shaded { background: var(--primary); color: #fff; font-weight: 700; }

/* Stars */
.stars { display: flex; gap: 4px; }
.star { width: 24px; height: 24px; border-radius: 4px; cursor: pointer; }
.star.filled { background: var(--warning); }
.star.empty { background: #E4ECFC; }

/* Page visibility */
.page { display: none; }
.page.active { display: flex; flex-direction: column; flex: 1; }
.portal-mode .page.active { display: flex; flex-direction: column; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }

.hidden { display: none !important; }
</style>
<style>
/* ========== TS 模块补充样式（复用宿主设计系统，仅补充宿主未定义的类） ========== */
.tag { display: inline-flex; padding: 2px 7px; border-radius: 4px; background: var(--primary-bg); color: var(--primary); font-size: 11px; font-weight: 600; margin-right: 4px; }

.person-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); margin-bottom: 10px; }
.person-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-bg); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.person-info { flex: 1; }
.person-name { font-size: 14px; font-weight: 600; }
.person-sub { font-size: 11px; color: var(--text-muted); }

.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: flex; gap: 14px; padding-bottom: 18px; position: relative; }
.tl-item:not(:last-child)::before { content:''; position:absolute; left:13px; top:28px; bottom:0; width:2px; background: var(--border); }
.tl-dot { width: 28px; height: 28px; min-width: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; z-index: 1; }
.tl-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.tl-title { font-size: 13px; font-weight: 600; }
.tl-meta { font-size: 11px; color: var(--text-muted); }
.tl-text { font-size: 13px; color: var(--text-secondary); }

function getTask(id){ return store.tasks.find(t=>t.taskId===id); }

// Q4 视图收敛：按角色确定可见的视图标签
function availableTabs(){
  if(canSeeAll()) return ['待我审批','待我指派','全部'];
  return ['我的申请','我执行的'];
}
// 按 (角色, 视图) 过滤任务
function filterTasks(){
  const me = ROLE_USER[currentRole];
  let list = store.tasks.slice();
  if(currentView === '我的申请') list = list.filter(t=>t.applicant===me);
  else if(currentView === '我执行的') list = list.filter(t=>t.assignee===me);
  else if(currentView === '待我审批') list = list.filter(t=>t.status==='待审批');
  else if(currentView === '待我指派') list = list.filter(t=>t.status==='已审批待指派');
  else if(currentView === '全部'){ if(!canSeeAll()) list = list.filter(t=>t.applicant===me || t.assignee===me); }
  return list;
}
function now(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

function submitRequest(){

  const id = 'TS20260723'+seq;
  store.tasks.unshift({ taskId:id, opportunityId:oppId, opportunityName:opp.name, applicant:ROLE_USER['销售'], venue, serviceAddress:addr, contactName:contact, contactPhone:phone, description:desc, expectStart:document.getElementById('f-es').value, expectEnd:document.getElementById('f-ee').value, urgency:urgency, status:'待审批', rejectReason:'', approvals:[], assignee:'', assigneeRole:'', assignedBy:'', assignedAt:'', progress:[], worklogs:[] });

function approveTask(id, pass){
  const t = getTask(id); if(!t) return;
  const node = t.approvals.length+1;
  const approver = ROLE_USER[currentRole]+'（'+currentRole+'）';
  if(pass){
    t.approvals.push({node, approver, result:'通过', comment:'同意', time:now()});
    if(node>=2) t.status='已审批待指派';
  } else {
    t.approvals.push({node, approver, result:'驳回', comment:'资源紧张，建议下季度', time:now()});
    t.status='已驳回'; t.rejectReason='资源紧张，建议下季度';
  }
  showToast(pass?'已通过':'已驳回');
  renderAdminPage();
}

function updateConversion(){
  const unit = document.getElementById('w-unit').value;
  const h = parseFloat(document.getElementById('w-hours').value||0);
  const conv = unit==='人天' ? (h*8).toFixed(2)+' 小时' : h.toFixed(2)+' 小时';
  document.getElementById('w-conv').textContent = conv;
}
function submitWorklog(){
  const t = getTask(currentTaskId); if(!t) return;
  const unit = document.getElementById('w-unit').value;
  const h = parseFloat(document.getElementById('w-hours').value||0);
  const hoursVal = unit==='人天' ? (h*8) : h;
  const rawUnit = unit, rawHours = h;
  const start = document.getElementById('w-start').value.replace('T',' ');
  const end = document.getElementById('w-end').value.replace('T',' ');
  const addr = document.getElementById('w-addr').value || '—';
  const type = document.getElementById('w-type').value;
  t.worklogs.push({ personId:'PMS-U10086', personName:t.assignee||ROLE_USER['实施工程师'], workStart:start, workEnd:end, unit:'小时', workHours:hoursVal, rawUnit, rawHours, address:addr, workContent:type, pushStatus:'成功' });
  if(t.status==='执行中') t.status='已完成';
  showToast('工时已登记并推送项目管理系统（K）');
  navigate('presale-detail',{taskId:t.taskId});
}

  const c = store.customers.find(x=>x.id===cid);

  if(c.portalInvite){

}

  const link = `https://portal.secdemo.com/activate?token=${invite.token}`;

    </div>`;
}
function generateRegLink(){
  const c = store.customers[0];
  const err = document.getElementById('regLinkErr');
  err.classList.remove('show');
  if(!c.contactPhone || !c.contactPhone.trim()){ err.textContent='登记联系人手机号为空，无法预置基础平台外部用户（CM-004 前置校验）'; err.classList.add('show'); return; }
  const token = 'REG-' + Math.random().toString(36).slice(2,10).toUpperCase();
  const platformUserId = c.portalIdentity && c.portalIdentity.platformUserId ? c.portalIdentity.platformUserId : 'EXT-' + c.id;
  c.portalIdentity = { platformUserId, role:'portal_customer', mappingStatus:'待绑定' };
  c.portalInvite = { token, status:'待使用', platformUserId, createdAt: Date.now(), expireAt: Date.now()+2*3600*1000 };
  showToast('基础平台外部用户和 Portal 角色已预置，OIDC 绑定链接已生成');
  const box = document.getElementById('regLinkModal');
  if(box) box.innerHTML = regLinkModalInner(c);
  const badge = document.getElementById('portalAcctBadge');
  if(badge) badge.innerHTML = getPortalAcctStatus(c.id);
  startRegCountdown(c);
}
function regenerateRegLink(){
  generateRegLink();
  showToast('已重新生成注册链接，旧链接失效');
}
function revokeRegLink(){
  const c = store.customers[0];
  if(c.portalInvite) c.portalInvite.status='已撤销';
  if(regLinkInterval){ clearInterval(regLinkInterval); regLinkInterval=null; }
  const box = document.getElementById('regLinkModal');
  if(box) box.innerHTML = regLinkModalInner(c);
  const badge = document.getElementById('portalAcctBadge');
  if(badge) badge.innerHTML = getPortalAcctStatus(c.id);
}
function copyRegLink(){
  const el = document.getElementById('regLinkInput');
  if(el && navigator.clipboard) navigator.clipboard.writeText(el.value);
  showToast('注册链接已复制');
}
function startRegCountdown(c){
  if(regLinkInterval){ clearInterval(regLinkInterval); regLinkInterval=null; }
  if(!c.portalInvite || c.portalInvite.status!=='待使用') return;
  regLinkInterval = setInterval(()=>{
    const c2 = store.customers[0];
    if(!c2.portalInvite || c2.portalInvite.status!=='待使用'){ if(regLinkInterval) clearInterval(regLinkInterval); regLinkInterval=null; return; }
    const ms = c2.portalInvite.expireAt - Date.now();
    const remainEl = document.getElementById('regRemain');
    if(ms<=0){
      c2.portalInvite.status='已过期';
      if(regLinkInterval) clearInterval(regLinkInterval); regLinkInterval=null;
      const box = document.getElementById('regLinkModal');
      if(box) box.innerHTML = regLinkModalInner(c2);
      const badge = document.getElementById('portalAcctBadge');
      if(badge) badge.innerHTML = getPortalAcctStatus(c2.id);
      return;
    }
    if(remainEl) remainEl.textContent = '剩余 ' + fmtRemain(ms);
  }, 1000);
}
function fmtRemain(ms){
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return (h>0? h+'时':'') + m + '分' + sec + '秒';
}

    const reasons = ['价格','技术','关系','客户预算','竞争对手','其他'];
    box.innerHTML = `
      <div class="form-label" style="margin-bottom:8px">失败原因 <span class="req-star">*</span> <span style="font-weight:400;color:var(--text-muted)">（V2.1 R2 必填）</span></div>
      <select class="modal-select" id="lostReasonSel">
        <option value="">请选择失败原因…</option>
        ${reasons.map(r=>`<option value="${r}">${r}</option>`).join('')}
      </select>
      <textarea class="modal-textarea" id="lostReasonNote" placeholder="补充说明（可选）" style="margin-top:8px"></textarea>`;
  } else {
    box.innerHTML = '';
  }
}

function pickContract(cid, cname){
  stageModalState.contractId = cid;
  document.querySelectorAll('#stageModal .contract-item').forEach(i=>i.classList.toggle('active', i.dataset.cid===cid));
}

function confirmStageAdvance(){
  const o = getOpp(currentOppId);
  const target = stageModalState.target;
  const err = document.getElementById('stageErr');
  if(!target){ err.textContent='请选择目标阶段'; err.classList.add('show'); return; }
  if(target===o.stage){ err.textContent='目标阶段不能与当前阶段相同'; err.classList.add('show'); return; }
  if(target==='已签约'){
    const manualEl = document.getElementById('manualContract');
    const manual = manualEl ? manualEl.value.trim() : '';
    if(!stageModalState.contractId && !manual){ err.textContent='已签约必须关联合同（选合同或录入编号），否则阻断（R1）'; err.classList.add('show'); return; }
    if(stageModalState.contractId){ const c = queryContractsMock(findCustomer(o)?findCustomer(o).id:'').find(x=>x.contractId===stageModalState.contractId); o.contractRef = stageModalState.contractId; o.contractName = c?c.contractName:stageModalState.contractId; }
    else { o.contractRef = manual; o.contractName = manual; }
    o.lostReason = '';
  }
  if(target==='失败'){
    const sel = document.getElementById('lostReasonSel');
    if(!sel || !sel.value){ err.textContent='失败必须填写原因，否则阻断（R2）'; err.classList.add('show'); return; }
    o.lostReason = sel.value + (document.getElementById('lostReasonNote').value.trim()?('：'+document.getElementById('lostReasonNote').value.trim()):'');
    o.contractRef = ''; o.contractName = '';
  }
  o.stage = target;
  o.oppStatus = (target==='已签约'||target==='失败') ? '已关闭' : '跟进中';
  closeModal('stageModal');
  toast(`阶段已调整为「${target}」，变更已立即生效`);
  render();
}

// 模拟 G 回写：报价与投标子系统回传驱动终态（V2.1 D3 回传能力）
function simulateWin(id){
  const o = getOpp(id); if(!o) return;
  const cust = findCustomer(o);
  const list = queryContractsMock(cust?cust.id:'');
  const c = list[0] || null;
  if(!c){
    o.stage='已签约'; o.oppStatus='已关闭'; o.contractRef=''; o.contractName='';
    o.qbStatus = { type: o.qbStatus?o.qbStatus.type:'投标', status:'中标·待关联合同', at: new Date().toLocaleString('zh-CN') };
    toast('中标回传 → 已进入「已签约」，合同待补充');
    render();
    return;
  }
  o.stage='已签约'; o.oppStatus='已关闭'; o.contractRef=c.contractId; o.contractName=c.contractName;
  o.qbStatus = { type: o.qbStatus?o.qbStatus.type:'投标', status:'中标', at: new Date().toLocaleString('zh-CN') };
  toast('中标回传已关联合同 → 商机推进至「已签约」');
  render();
}
function simulateLose(id){
  const o = getOpp(id); if(!o) return;
  o.stage='失败'; o.oppStatus='已关闭'; o.lostReason='';
  o.qbStatus = { type: o.qbStatus?o.qbStatus.type:'投标', status:'落标·待补原因', at: new Date().toLocaleString('zh-CN') };
  toast('落标回传 → 已进入「失败」，失败原因待补充');
  render();
}

function closeModal(id){ if(regLinkInterval){ clearInterval(regLinkInterval); regLinkInterval=null; } const m=document.getElementById(id); if(m) m.remove(); }
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.25)'; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._timer); t._timer=setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .4s'; }, 2600);
}

// ==================== INIT ====================
render();
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('tab-item')) {
    const parent = e.target.parentElement;
    parent.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentCustomerTab = e.target.textContent.trim();
    const body = document.getElementById('customerTabBody');
    if (body) body.innerHTML = renderCustomerTabContent(currentCustomerTab);
  }
  if (e.target.classList.contains('star')) {
    const stars = e.target.parentElement.querySelectorAll('.star');
    const idx = Array.from(stars).indexOf(e.target);
    stars.forEach((s,i) => s.classList.toggle('filled', i <= idx));
    stars.forEach((s,i) => s.classList.toggle('empty', i > idx));
  }
});
</script>
