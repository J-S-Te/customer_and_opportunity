<style>
/* ========== CSS Design Tokens ========== */
:root {
  --primary: #2563EB;
  --primary-light: #3B82F6;
  --primary-bg: #EFF6FF;
  --secondary: #3B82F6;
  --accent: #059669;
  --accent-bg: #ECFDF5;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --card-border: #E4ECFC;
  --sidebar: #0F172A;
  --sidebar-active: #1E3A5F;
  --sidebar-hover: #1E293B;
  --text: #0F172A;
  --text-secondary: #475569;
  --text-muted: #64748B;
  --text-placeholder: #94A3B8;
  --border: #E4ECFC;
  --input-bg: #F1F5FD;
  --danger: #DC2626;
  --danger-bg: #FEF2F2;
  --warning: #F59E0B;
  --warning-bg: #FEF3C7;
  --purple: #8B5CF6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 2px 6px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 20px rgba(0,0,0,0.08);
  --radius-sm: 6px;
  --radius: 8px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --font-heading: 'Lexend', 'PingFang SC', sans-serif;
  --font-body: 'Source Sans 3', 'PingFang SC', sans-serif;
  --font-mono: 'Lexend', 'JetBrains Mono', monospace;
}

@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap');

/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
a { color: var(--primary); text-decoration: none; }
button { cursor: pointer; border: none; outline: none; font-family: inherit; }

/* ========== Layout ========== */
.app { display: flex; height: 100vh; overflow: hidden; }
.app.portal-login-active .sidebar,
.app.portal-login-active .header { display: none; }

/* Sidebar */
.sidebar { width: 240px; min-width: 240px; background: var(--sidebar); display: flex; flex-direction: column; padding: 24px 16px; gap: 6px; }
.sidebar-logo { display: flex; align-items: center; gap: 12px; padding: 4px 8px; margin-bottom: 20px; }
.sidebar-logo-icon { width: 36px; height: 36px; background: var(--primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px; font-family: var(--font-heading); }
.sidebar-logo-text { color: #fff; font-family: var(--font-heading); font-weight: 700; font-size: 16px; }
.sidebar-divider { height: 1px; background: var(--sidebar-hover); margin: 4px 0 12px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius); color: var(--text-placeholder); font-size: 14px; cursor: pointer; transition: all 0.15s; position: relative; }
.nav-item:hover { background: var(--sidebar-hover); color: #CBD5E1; }
.nav-item.active { background: var(--sidebar-active); color: #E2E8F0; font-weight: 600; }
.nav-item .nav-dot { width: 20px; height: 20px; border-radius: 4px; background: #475569; }
.nav-item.active .nav-dot { background: var(--primary-light); }
.nav-item .nav-badge { margin-left: auto; padding: 2px 8px; border-radius: 10px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 600; min-width: 22px; text-align: center; }

/* Main Content */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.header { height: 56px; min-height: 56px; background: var(--card); display: flex; align-items: center; padding: 0 28px; gap: 16px; box-shadow: var(--shadow-sm); z-index: 10; }
.header-title { font-family: var(--font-heading); font-weight: 700; font-size: 18px; }
.header-breadcrumb { color: var(--text-muted); font-size: 13px; }
.header-spacer { flex: 1; }
.content { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 20px; }

/* Portal Account Security */
.info-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--card-border); }
.info-label { color: var(--text-muted); font-size: 13px; }
.info-value { font-weight: 600; font-size: 14px; color: var(--text); }
.pwd-strength { height: 8px; border-radius: 4px; background: #E2E8F0; overflow: hidden; margin-top: 4px; }
.pwd-strength-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }

/* ========== Components ========== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 600; transition: all 0.15s; white-space: nowrap; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #1D4ED8; }
.btn-secondary { background: var(--input-bg); color: var(--text-secondary); }
.btn-secondary:hover { background: #E2E8F0; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-lg { padding: 10px 20px; font-size: 15px; }

.badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-success { background: var(--accent-bg); color: var(--accent); }
.badge-info { background: var(--primary-bg); color: var(--primary); }
.badge-warning { background: var(--warning-bg); color: #D97706; }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-gray { background: #F1F5F9; color: var(--text-placeholder); }
.badge-purple { background: #F5F3FF; color: var(--purple); }

.card { background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--card-border); }
.card-body { padding: 24px; }

.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat-card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.stat-card .stat-label { font-size: 12px; color: var(--text-muted); }
.stat-card .stat-value { font-family: var(--font-heading); font-size: 28px; font-weight: 700; }
.stat-card .stat-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.stat-trend.up { background: var(--accent-bg); color: var(--accent); }
.stat-trend.stable { background: var(--primary-bg); color: var(--primary); }

.filter-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-md); }
.filter-input { flex: 1; display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--input-bg); border-radius: var(--radius-sm); }
.filter-input input { border: none; outline: none; background: transparent; font-size: 13px; width: 100%; color: var(--text); }
.filter-input input::placeholder { color: var(--text-placeholder); }
.filter-select { display: flex; align-items: center; gap: 6px; padding: 7px 10px; background: var(--input-bg); border-radius: var(--radius-sm); font-size: 13px; color: var(--text-secondary); cursor: pointer; }
.filter-select .arrow { width: 12px; height: 12px; background: var(--text-placeholder); border-radius: 2px; }

.table-wrap { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-lg); overflow: hidden; }
.table-header { display: flex; background: var(--bg); border-bottom: 1px solid var(--card-border); font-size: 12px; font-weight: 600; color: var(--text-muted); }
.table-row { display: flex; border-bottom: 1px solid var(--card-border); align-items: center; transition: background 0.1s; }
.table-row:last-child { border-bottom: none; }
.table-row:hover { background: #FAFBFC; }
.table-row.alt { background: #FAFBFC; }
.table-row.warn { background: #FFF7ED; }
.tc { padding: 12px; display: flex; align-items: center; }
.tc-link { color: var(--primary); cursor: pointer; }
.tc-link:hover { text-decoration: underline; }

.pagination { display: flex; align-items: center; justify-content: center; padding: 14px; color: var(--text-muted); font-size: 13px; }

.kanban { display: flex; gap: 14px; overflow-x: auto; flex: 1; padding: 4px 0; }
.kanban-col { flex: 1; min-width: 200px; background: var(--input-bg); border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.kanban-col-header { display: flex; align-items: center; gap: 8px; }
.kanban-col-dot { width: 8px; height: 8px; border-radius: 50%; }
.kanban-col-title { font-size: 14px; font-weight: 700; color: var(--text-secondary); }
.kanban-col-count { margin-left: auto; width: 24px; height: 24px; border-radius: 6px; background: #E2E8F0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-muted); }
.kanban-card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-md); cursor: pointer; }
.kanban-card .kc-name { font-size: 13px; font-weight: 600; }
.kanban-card .kc-customer { font-size: 11px; color: var(--text-muted); }
.kanban-card .kc-row { display: flex; align-items: center; justify-content: space-between; }
.kanban-card .kc-amount { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--primary); }
.kanban-card .kc-date { font-size: 11px; color: var(--text-placeholder); }
.kanban-card .kc-owner { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
.kc-avatar { width: 20px; height: 20px; border-radius: 50%; }

.overview-card { display: flex; gap: 32px; padding: 20px 24px; flex-wrap: wrap; }
.ov-item { display: flex; flex-direction: column; gap: 4px; }
.ov-label { font-size: 11px; color: var(--text-placeholder); }
.ov-value { font-size: 14px; font-weight: 600; }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--card-border); margin-bottom: -1px; }
.tab-item { padding: 10px 16px; font-size: 14px; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab-item.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* Detail Page Layout */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.detail-section { display: flex; flex-direction: column; gap: 14px; }
.detail-label { font-size: 13px; color: var(--text-muted); }
.detail-value { font-size: 14px; font-weight: 500; }

.follow-record { display: flex; gap: 12px; padding: 14px; background: #FAFBFC; border-radius: var(--radius); }
.follow-timeline { width: 2px; background: var(--primary); }
.follow-content { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.follow-head { display: flex; align-items: center; gap: 8px; }
.follow-date { font-size: 11px; color: var(--text-muted); }

.contact-row { display: flex; align-items: center; gap: 14px; padding: 14px; background: #FAFBFC; border-radius: var(--radius); }

.progress-bar-wrap { display: flex; align-items: center; padding: 16px 20px; gap: 0; }
.progress-step { flex: 1; display: flex; align-items: center; gap: 8px; }
.progress-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.progress-dot.done { background: var(--accent); color: #fff; }
.progress-dot.current { background: var(--primary); color: #fff; }
.progress-dot.pending { background: #E4ECFC; color: var(--text-placeholder); }
.progress-line { flex: 1; height: 2px; }
.progress-line.done { background: var(--accent); }
.progress-line.pending { background: #E4ECFC; }

.approval-node { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: var(--radius); background: var(--accent-bg); }
.approval-check { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; }
.approval-info { flex: 1; }

/* Portal Pages */
.login-page { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg); }
.login-card { width: 420px; background: var(--card); border-radius: var(--radius-xl); padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 24px; box-shadow: var(--shadow-lg); border: 1px solid var(--card-border); }
.login-card .login-logo { width: 48px; height: 48px; background: var(--primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 22px; }
.login-card h2 { font-family: var(--font-heading); font-size: 24px; }
.login-card .login-sub { color: var(--text-muted); font-size: 14px; }
.login-form { width: 100%; display: flex; flex-direction: column; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
.form-group input, .form-group select, .form-group textarea { padding: 10px 12px; border: 1px solid var(--card-border); border-radius: var(--radius); background: var(--bg); font-size: 14px; font-family: inherit; color: var(--text); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.form-group textarea { resize: vertical; min-height: 80px; }

.portal-sidebar { width: 280px; display: flex; flex-direction: column; gap: 10px; }
.portal-sidebar .action-btn { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--radius); background: #FAFBFC; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-secondary); transition: all 0.15s; }
.portal-sidebar .action-btn:hover { background: var(--primary-bg); color: var(--primary); }
.action-dot { width: 20px; height: 20px; border-radius: 4px; }

/* Step Wizard */
.step-wizard { display: flex; align-items: center; gap: 0; margin-bottom: 24px; }
.step-item { flex: 1; display: flex; align-items: center; gap: 8px; }
.step-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.step-dot.active { background: var(--primary); color: #fff; }
.step-dot.inactive { background: #E4ECFC; color: var(--text-placeholder); }
.step-line { flex: 1; height: 2px; }
.step-line.active { background: var(--primary); }
.step-line.inactive { background: #E4ECFC; }

/* Grade Matrix (定级报告) */
.matrix-table { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-size: 13px; background: #fff; }
.matrix-table th, .matrix-table td { border: 1px solid var(--border); padding: 8px 6px; text-align: center; }
.matrix-table th { background: var(--input-bg); font-weight: 600; color: var(--text); }
.matrix-cell { cursor: pointer; transition: background .15s; }
.matrix-cell:hover { background: #eef4fb; }
.matrix-cell.shaded { background: var(--primary); color: #fff; font-weight: 700; }

/* Stars */
.stars { display: flex; gap: 4px; }
.star { width: 24px; height: 24px; border-radius: 4px; cursor: pointer; }
.star.filled { background: var(--warning); }
.star.empty { background: #E4ECFC; }

/* Page visibility */
.page { display: none; }
.page.active { display: flex; flex-direction: column; flex: 1; }
.portal-mode .page.active { display: flex; flex-direction: column; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }

.hidden { display: none !important; }
</style>

// 定级报告（附件1 模板）— 等级矩阵表：点击单元格涂黑/撤销，单表仅一个高亮
function renderGradeMatrix(prefix, rows, preShade) {
  const head = `<tr><th style="width:42%;text-align:left">受破坏时侵害的客体</th><th>一般损害</th><th>严重损害</th><th>特别严重损害</th></tr>`;
  const body = rows.map((r, ri) => `
    <tr>
      <td style="text-align:left;font-weight:600">${r.obj}</td>
      ${r.vals.map((v, ci) => {
        const shaded = (preShade && preShade[0]===ri && preShade[1]===ci);
        return `<td class="matrix-cell ${shaded?'shaded':''}" onclick="shadeMatrixCell(this,'${prefix}')">${v}</td>`;
      }).join('')}
    </tr>`).join('');
  return `<table class="matrix-table" id="${prefix}"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function shadeMatrixCell(td, prefix) {
  const t = document.getElementById(prefix);
  if (!t) return;
  t.querySelectorAll('td.matrix-cell.shaded').forEach(c => c.classList.remove('shaded'));
  td.classList.add('shaded');
}
function addSubsystemRow() {
  const tb = document.getElementById('subsysBody');
  if (!tb) return;
  const n = tb.children.length + 1;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td style="text-align:center;border:1px solid var(--border);padding:6px">${n}</td>`
    + `<td style="border:1px solid var(--border);padding:6px"><input placeholder="子系统名称" style="width:100%;border:none;background:transparent"></td>`
    + `<td style="border:1px solid var(--border);padding:6px"><input placeholder="业务功能描述" style="width:100%;border:none;background:transparent"></td>`;
  tb.appendChild(tr);
}

function goToFilingStep(i) {

  currentFilingStep = i;

  if (pc) pc.innerHTML = renderFilingPage();
}

        <div class="info-row"><span class="info-label">登录 IP / 属地</span><span class="info-value">${a.lastIp} · ${a.lastLocation}</span></div>
        <div class="info-row"><span class="info-label">登录设备</span><span class="info-value">${a.lastDevice}</span></div>
        <div class="info-row" style="border-bottom:none"><span class="info-label">登录账号</span><span class="info-value">${a.account}</span></div>
      </div></div>
      <div class="card"><div class="card-body">
        <h3 style="font-size:16px;margin-bottom:6px">账号与会话安全</h3>
        <div style="font-size:13px;color:var(--text-muted);line-height:1.7;margin-top:12px">密码设置、找回、登录失败锁定和 MFA 由基础平台统一身份系统负责；Portal 不保存或校验客户密码。</div>
        <div class="info-row"><span class="info-label">本地会话到期</span><span class="info-value">${a.sessionExpiresAt}</span></div>
        <div style="display:flex;gap:12px;margin-top:16px">
          <button class="btn btn-primary" onclick="openIdentitySecurityCenter()">前往统一身份安全中心</button>

        </div>
      </div></div>
    </div>
  `;

function openIdentitySecurityCenter() {
  alert('将跳转基础平台统一身份账号安全中心（改密 / MFA / 账号恢复）');
}

function revokeOtherSessions() {
  alert('其他 Portal 本地会话已撤销');
}


// ==================== INIT ====================
render();
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('star')) {
    const stars = e.target.parentElement.querySelectorAll('.star');
    const idx = Array.from(stars).indexOf(e.target);
    stars.forEach((s,i) => s.classList.toggle('filled', i <= idx));
    stars.forEach((s,i) => s.classList.toggle('empty', i > idx));
  }
});

</script>
