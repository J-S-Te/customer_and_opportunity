openapi: 3.1.0
info:
  title: Customer and Opportunity CRM API
  version: 0.2.0
  description: |-
    The current CRM production HTTP surface. JSON operations use the common
    envelope. External Provider contracts are intentionally out of scope and
    remain pending until their owning systems publish signed contracts.
servers:
  - url: '{origin}/customer-opportunity'
    description: APP_PATH_PREFIX defaults to /customer-opportunity.
    variables:
      origin: {default: 'https://crm.example.invalid'}
tags:
  - {name: Authentication}
  - {name: Owner directory}
  - {name: Customer}
  - {name: Opportunity}
  - {name: Presale}
  - {name: Notification}
  - {name: Portal invite}
  - {name: Machine integration}
paths:
  /livez:
    get: {$ref: '#/components/x-operations/crmLive'}
  /readyz:
    get: {$ref: '#/components/x-operations/crmReady'}
  /healthz:
    get: {$ref: '#/components/x-operations/crmHealth'}
  /auth/login:
    get: {$ref: '#/components/x-operations/crmLogin'}
  /auth/callback:
    get: {$ref: '#/components/x-operations/crmCallback'}
  /auth/logout:
    post: {$ref: '#/components/x-operations/crmLogout'}
  /api/v1/auth/me:
    get: {$ref: '#/components/x-operations/crmMe'}
  /api/v1/capabilities:
    get: {$ref: '#/components/x-operations/getRuntimeCapabilities'}
  /api/v1/owner-directory:
    get: {$ref: '#/components/x-operations/listOwnerDirectory'}
  /api/v1/customers:
    get: {$ref: '#/components/x-operations/listCustomers'}
    post: {$ref: '#/components/x-operations/createCustomer'}
  /api/v1/customers/duplicate-check:
    post: {$ref: '#/components/x-operations/checkCustomerDuplicate'}
  /api/v1/customers/merge:
    post: {$ref: '#/components/x-operations/mergeCustomers'}
  /api/v1/customers/imports/preview:
    post: {$ref: '#/components/x-operations/previewCustomerImport'}
  /api/v1/customers/imports/{jobNo}/commit:
    post: {$ref: '#/components/x-operations/commitCustomerImport'}
  /api/v1/customers/imports/{jobNo}/errors:
    get: {$ref: '#/components/x-operations/downloadCustomerImportErrors'}
  /api/v1/customers/{id}:
    get: {$ref: '#/components/x-operations/getCustomer'}
    put: {$ref: '#/components/x-operations/updateCustomer'}
  /api/v1/customers/{id}/contacts:
    get: {$ref: '#/components/x-operations/listCustomerContacts'}
  /api/v1/customers/{id}/stakeholders:
    get: {$ref: '#/components/x-operations/listCustomerStakeholders'}
    put: {$ref: '#/components/x-operations/replaceCustomerStakeholders'}
  /api/v1/customers/{id}/systems:
    get: {$ref: '#/components/x-operations/listCustomerSystems'}
    put: {$ref: '#/components/x-operations/replaceCustomerSystems'}
  /api/v1/customers/{id}/opportunities:
    get: {$ref: '#/components/x-operations/listCustomerOpportunities'}
  /api/v1/customers/{id}/projects:
    get: {$ref: '#/components/x-operations/listCustomerProjects'}
  /api/v1/customers/{id}/audit-logs:
    get: {$ref: '#/components/x-operations/listCustomerAuditLogs'}
  /api/v1/customers/{id}/void:
    post: {$ref: '#/components/x-operations/voidCustomer'}
  /api/v1/customers/{id}/restore:
    post: {$ref: '#/components/x-operations/restoreCustomer'}
  /api/v1/customers/{id}/followups:
    get: {$ref: '#/components/x-operations/listCustomerFollowups'}
    post: {$ref: '#/components/x-operations/createCustomerFollowup'}
  /api/v1/customer-exports:
    post: {$ref: '#/components/x-operations/requestCustomerExport'}
  /api/v1/customers/{id}/portal-invites:
    post: {$ref: '#/components/x-operations/createPortalInvite'}
  /api/v1/customers/{id}/portal-invites/current:
    get: {$ref: '#/components/x-operations/getCurrentPortalInvite'}
  /api/v1/customers/{id}/portal-access:
    get: {$ref: '#/components/x-operations/getPortalAccessStatus'}
  /api/v1/customers/{id}/portal-access/disable:
    post: {$ref: '#/components/x-operations/disablePortalAccess'}
  /api/v1/portal-invites/{inviteNo}/revoke:
    post: {$ref: '#/components/x-operations/revokePortalInvite'}
  /api/v1/opportunity-stage-alert-rules:
    get: {$ref: '#/components/x-operations/listOpportunityAlertRules'}
  /api/v1/opportunity-stage-alert-rules/{stage}:
    put: {$ref: '#/components/x-operations/updateOpportunityAlertRule'}
  /api/v1/opportunity-stage-alerts:
    get: {$ref: '#/components/x-operations/listOpportunityAlerts'}
  /api/v1/opportunity-stage-alerts/{id}/read:
    post: {$ref: '#/components/x-operations/readOpportunityAlert'}
  /api/v1/opportunities:
    get: {$ref: '#/components/x-operations/listOpportunities'}
    post: {$ref: '#/components/x-operations/createOpportunity'}
  /api/v1/opportunities/board:
    get: {$ref: '#/components/x-operations/opportunityBoard'}
  /api/v1/opportunities/{id}:
    get: {$ref: '#/components/x-operations/getOpportunity'}
    put: {$ref: '#/components/x-operations/updateOpportunity'}
  /api/v1/opportunities/{id}/owner:
    put: {$ref: '#/components/x-operations/changeOpportunityOwner'}
  /api/v1/opportunities/{id}/members:
    get: {$ref: '#/components/x-operations/getOpportunityMembers'}
    put: {$ref: '#/components/x-operations/replaceOpportunityMembers'}
  /api/v1/opportunities/{id}/member-terms:
    get: {$ref: '#/components/x-operations/listOpportunityMemberTerms'}
  /api/v1/opportunities/{id}/void:
    post: {$ref: '#/components/x-operations/voidOpportunity'}
  /api/v1/opportunities/{id}/restore:
    post: {$ref: '#/components/x-operations/restoreOpportunity'}
  /api/v1/opportunities/{id}/stage-changes:
    post: {$ref: '#/components/x-operations/changeOpportunityStage'}
  /api/v1/opportunities/{id}/stage-history:
    get: {$ref: '#/components/x-operations/listOpportunityStageHistory'}
  /api/v1/opportunities/{id}/followups:
    get: {$ref: '#/components/x-operations/listOpportunityFollowups'}
    post: {$ref: '#/components/x-operations/createOpportunityFollowup'}
  /api/v1/opportunities/{id}/external-status:
    get: {$ref: '#/components/x-operations/getOpportunityExternalStatus'}
  /api/v1/opportunities/{id}/launch/quotation:
    post: {$ref: '#/components/x-operations/launchQuotation'}
  /api/v1/opportunities/{id}/launch/bid:
    post: {$ref: '#/components/x-operations/launchBid'}
  /api/v1/opportunities/{id}/terminal-todo:
    put: {$ref: '#/components/x-operations/completeOpportunityTerminalTodo'}
  /api/v1/opportunities/{id}/contract-transfer:
    post: {$ref: '#/components/x-operations/transferOpportunityContract'}
  /api/v1/opportunities/{id}/attachment-capabilities:
    get: {$ref: '#/components/x-operations/getOpportunityAttachmentCapabilities'}
  /api/v1/opportunities/{id}/attachments:
    get: {$ref: '#/components/x-operations/listOpportunityAttachments'}
    post: {$ref: '#/components/x-operations/createOpportunityAttachment'}
  /api/v1/opportunities/{id}/attachments/{attachmentID}/complete:
    post: {$ref: '#/components/x-operations/completeOpportunityAttachment'}
  /api/v1/opportunities/{id}/attachments/{attachmentID}/content:
    get: {$ref: '#/components/x-operations/downloadOpportunityAttachment'}
  /api/v1/opportunities/{id}/presale-requests:
    get: {$ref: '#/components/x-operations/listOpportunityPresaleRequests'}
  /api/v1/notifications:
    get: {$ref: '#/components/x-operations/listNotifications'}
  /api/v1/notifications/unread-count:
    get: {$ref: '#/components/x-operations/notificationUnreadCount'}
  /api/v1/notifications/{id}/read:
    post: {$ref: '#/components/x-operations/readNotification'}
  /api/v1/presale/engineers:
    get: {$ref: '#/components/x-operations/listPresaleEngineers'}
  /api/v1/presale/execution-departments:
    get: {$ref: '#/components/x-operations/listPresaleExecutionDepartments'}
  /api/v1/presale/engineers/sync:
    post: {$ref: '#/components/x-operations/syncPresaleEngineers'}
  /api/v1/presale/requests:
    get: {$ref: '#/components/x-operations/listPresaleRequests'}
    post: {$ref: '#/components/x-operations/createPresaleRequest'}
  /api/v1/presale/board:
    get: {$ref: '#/components/x-operations/presaleBoard'}
  /api/v1/presale/filter-options:
    get: {$ref: '#/components/x-operations/presaleFilterOptions'}
  /api/v1/presale/requests/{id}:
    get: {$ref: '#/components/x-operations/getPresaleRequest'}
  /api/v1/presale/requests/{id}/reopen:
    post: {$ref: '#/components/x-operations/reopenPresaleRequest'}
  /api/v1/presale/requests/{id}/contact-phone:
    get: {$ref: '#/components/x-operations/getPresaleContactPhone'}
  /api/v1/presale/requests/{id}/timeline:
    get: {$ref: '#/components/x-operations/presaleTimeline'}
  /api/v1/presale/requests/{id}/available-actions:
    get: {$ref: '#/components/x-operations/presaleAvailableActions'}
  /api/v1/presale/requests/{id}/approval-actions:
    post: {$ref: '#/components/x-operations/presaleApprovalAction'}
  /api/v1/presale/requests/{id}/approval-history:
    get: {$ref: '#/components/x-operations/presaleApprovalHistory'}
  /api/v1/presale/requests/{id}/assignments:
    get: {$ref: '#/components/x-operations/listPresaleAssignments'}
    put: {$ref: '#/components/x-operations/replacePresaleAssignments'}
  /api/v1/presale/requests/{id}/execution-department:
    put: {$ref: '#/components/x-operations/selectPresaleExecutionDepartment'}
  /api/v1/presale/requests/{id}/progress:
    post: {$ref: '#/components/x-operations/addPresaleProgress'}
  /api/v1/presale/requests/{id}/cancel:
    post: {$ref: '#/components/x-operations/cancelPresaleRequest'}
  /api/v1/presale/requests/{id}/worklogs:
    get: {$ref: '#/components/x-operations/listPresaleWorklogs'}
    post: {$ref: '#/components/x-operations/addPresaleWorklog'}
  /api/v1/presale/worklogs/{id}/retry:
    post: {$ref: '#/components/x-operations/retryPresaleWorklog'}
  /api/v1/presale/worklogs/{id}/delivery:
    get: {$ref: '#/components/x-operations/getPresaleWorklogDelivery'}
  /api/v1/presale/alert-rules:
    get: {$ref: '#/components/x-operations/listPresaleAlertRules'}
  /api/v1/presale/alert-rules/{type}:
    put: {$ref: '#/components/x-operations/updatePresaleAlertRule'}
  /api/v1/presale/approval-rules:
    get: {$ref: '#/components/x-operations/listPresaleApprovalRules'}
    post: {$ref: '#/components/x-operations/createPresaleApprovalRule'}
  /api/v1/presale/approval-rules/{id}:
    put: {$ref: '#/components/x-operations/updatePresaleApprovalRule'}
    delete: {$ref: '#/components/x-operations/deletePresaleApprovalRule'}
  /api/v1/presale/alerts:
    get: {$ref: '#/components/x-operations/listPresaleAlerts'}
  /api/v1/presale/alerts/{id}/read:
    post: {$ref: '#/components/x-operations/readPresaleAlert'}
  /api/v1/presale/reports/summary:
    get: {$ref: '#/components/x-operations/presaleReportSummary'}
  /api/v1/presale/reports/trend:
    get: {$ref: '#/components/x-operations/presaleReportTrend'}
  /api/v1/presale/reports/distribution:
    get: {$ref: '#/components/x-operations/presaleReportDistribution'}
  /api/v1/presale/reports/exports:
    post: {$ref: '#/components/x-operations/requestPresaleReportExport'}
  /api/v1/internal/portal/invites/verify:
    post: {$ref: '#/components/x-operations/verifyPortalInvite'}
  /api/v1/internal/portal/invites/consume:
    post: {$ref: '#/components/x-operations/consumePortalInvite'}
  /api/v1/internal/integrations/qb/status-events:
    post: {$ref: '#/components/x-operations/applyOpportunityExternalStatus'}
  /api/v1/internal/integrations/opportunity-attachment/scan-events:
    post: {$ref: '#/components/x-operations/applyOpportunityAttachmentScan'}
  /api/v1/internal/approval/callbacks/presale:
    post: {$ref: '#/components/x-operations/applyPresaleApprovalCallback'}
components:
  securitySchemes:
    crmSession:
      type: apiKey
      in: cookie
      name: customer_opportunity_session
      description: OIDC-backed server session. The configured cookie name may differ.
    machineJWT:
      type: oauth2
      description: Platform application JWT; issuer, audience, tenant, scope, timestamp and nonce are verified.
      flows:
        clientCredentials:
          tokenUrl: https://platform.example.invalid/oauth2/token
          scopes:
            portal.invite.verify: Verify and consume a Portal invitation.
            opportunity.status.write: Apply trusted quotation or bid status events.
            opportunity.attachment.scan.write: Apply attachment malware scan events.
            approval.callback.write: Apply trusted presale approval callbacks.
  parameters:
    CustomerID: {name: id, in: path, required: true, schema: {type: integer, format: uint64, minimum: 1}}
    OpportunityID: {name: id, in: path, required: true, schema: {type: integer, format: uint64, minimum: 1}}
    NumericID: {name: id, in: path, required: true, schema: {type: integer, format: uint64, minimum: 1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
  schemas:
    Envelope:
      type: object
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        data: {}
        details: {}
    Error:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      examples:
        - {code: COMMON_VERSION_CONFLICT, message: resource was modified by another request, request_id: req_123}
    VersionedReason:
      type: object
      required: [version, reason]
      properties:
        version: {type: integer, format: uint64, minimum: 1}
        reason: {type: string, maxLength: 500}
    ReasonOnly:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    OwnerDirectoryOrganization:
      type: object
      additionalProperties: false
      required: [organization_id, organization_name, is_primary]
      properties:
        organization_id: {type: string, minLength: 1, maxLength: 64, description: Authoritative platform organization ID.}
        organization_name: {type: string, minLength: 1, maxLength: 200}
        is_primary: {type: boolean}
    OwnerDirectoryUser:
      type: object
      additionalProperties: false
      required: [user_id, display_name, organizations]
      properties:
        user_id: {type: string, minLength: 1, maxLength: 64, description: Platform OIDC subject (`sub`); never a PMS person ID.}
        display_name: {type: string, minLength: 1, maxLength: 200}
        organizations:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/OwnerDirectoryOrganization'}
    OwnerDirectoryPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/OwnerDirectoryUser'}}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 50}
        total: {type: integer, format: int64, minimum: 0}
    OwnerDirectoryEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/OwnerDirectoryPage'}
    CreateCustomer:
      type: object
      required: [name, customer_type, industry, region, owner_user_id, contacts, reason]
      properties:
        name: {type: string, maxLength: 200}
        unified_credit_code: {type: string, maxLength: 64}
        customer_type: {type: string, maxLength: 64}
        industry: {type: string, maxLength: 64}
        region: {type: string, maxLength: 64}
        owner_user_id: {type: string, maxLength: 64}
        owner_org_id: {type: string, maxLength: 64}
        contacts: {type: array, minItems: 1, items: {type: object}}
        duplicate_override: {type: boolean}
        duplicate_override_reason: {type: string, maxLength: 500}
        reason: {type: string, maxLength: 500}
    CreateOpportunity:
      type: object
      required: [name, customer_id, type, source, expected_amount, expected_sign_date, requirement_summary, owner_user_id]
      properties:
        name: {type: string, maxLength: 200}
        customer_id: {type: integer, format: uint64, minimum: 1}
        type: {type: string, maxLength: 64}
        source: {type: string, maxLength: 64}
        expected_amount: {type: string}
        expected_sign_date: {type: string, format: date}
        requirement_summary: {type: string}
        system_count: {type: integer, format: uint32}
        pain_points: {type: string, maxLength: 10000}
        competitor_info: {type: string, maxLength: 10000}
        owner_user_id: {type: string, maxLength: 64}
        owner_org_id: {type: string, maxLength: 64}
    StageChange:
      type: object
      required: [target_stage, reason, version]
      properties:
        target_stage: {type: string}
        reason: {type: string, maxLength: 500}
        contract_ref: {type: [string, 'null'], maxLength: 64}
        lost_reason: {type: [string, 'null'], maxLength: 64}
        version: {type: integer, format: uint64, minimum: 1}
    PresaleCreate:
      type: object
      required: [opportunity_id, venue, contact_name, contact_phone, description, expected_start, expected_end, urgency]
      properties:
        opportunity_id: {type: integer, format: uint64, minimum: 1}
        venue: {type: string}
        service_address: {type: string}
        contact_name: {type: string}
        contact_phone: {type: string}
        description: {type: string}
        expected_start: {type: string, format: date-time}
        expected_end: {type: string, format: date-time}
        urgency: {type: string}
    PresaleReopen:
      type: object
      required: [venue, contact_name, contact_phone, description, expected_start, expected_end, urgency]
      properties:
        venue: {type: string}
        service_address: {type: string}
        contact_name: {type: string}
        contact_phone: {type: string}
        description: {type: string}
        expected_start: {type: string, format: date-time}
        expected_end: {type: string, format: date-time}
        urgency: {type: string}
    PresaleAlert:
      type: object
      additionalProperties: false
      required: [id, request_id, request_no, alert_type, rule_version, basis_at, due_at, status, recipient_kind]
      properties:
        id: {type: integer, format: uint64, minimum: 1}
        request_id: {type: integer, format: uint64, minimum: 1}
        request_no: {type: string, maxLength: 32}
        alert_type: {type: string, enum: [APPROVAL_NODE_1_OVERDUE, APPROVAL_NODE_2_OVERDUE, ASSIGNMENT_OVERDUE, EXECUTION_DUE_SOON, EXECUTION_OVERDUE]}
        rule_version: {type: integer, format: uint64, minimum: 1}
        basis_at: {type: string, format: date-time}
        due_at: {type: string, format: date-time}
        status: {type: string, enum: [UNREAD, READ]}
        recipient_kind: {type: string, enum: [USER, PERSON], description: USER is the CRM OIDC subject namespace; PERSON is the separately signed PMS person_id namespace.}
        sent_at: {type: [string, 'null'], format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
    PresaleAlertPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PresaleAlert'}}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
    PresaleAlertListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/PresaleAlertPage'}
    ExternalStatusEvent:
      type: object
      required: [opportunity_id, source_id, status, changed_at]
      properties:
        opportunity_id: {type: integer, format: uint64, minimum: 1}
        type: {type: string, maxLength: 16}
        source_id: {type: string, maxLength: 64}
        status: {type: string, maxLength: 32}
        source_amount: {type: [string, 'null']}
        contract_ref: {type: [string, 'null'], maxLength: 64}
        lost_reason: {type: [string, 'null'], maxLength: 64}
        changed_at: {type: string, format: date-time}
    QuoteAmountCheck:
      type: object
      required: [status, warning, opportunity_version, expected_amount]
      properties:
        status: {type: string, enum: [NO_APPROVED_QUOTE, APPROVED_QUOTE_AMOUNT_MISSING, MATCH, MISMATCH]}
        warning: {type: boolean, description: True only for a non-blocking amount mismatch.}
        opportunity_version: {type: integer, format: uint64, minimum: 1}
        expected_amount: {type: string, pattern: '^[0-9]+\\.[0-9]{2}$'}
        approved_quote_amount: {type: [string, 'null'], pattern: '^[0-9]+\\.[0-9]{2}$'}
        approved_quote_source_id: {type: [string, 'null'], maxLength: 64}
        approved_quote_changed_at: {type: [string, 'null'], format: date-time}
  responses:
    OK:
      description: Successful JSON response
      content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
    Created:
      description: Created JSON response
      content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
    Error:
      description: Error envelope
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NoStoreError:
      description: Non-cacheable error envelope for a sensitive-data operation.
      headers:
        Cache-Control: {schema: {type: string, const: 'no-store, private'}}
        Pragma: {schema: {type: string, const: no-cache}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PresaleAlertList:
      description: Personal presale alert page with explicit USER/PERSON recipient namespaces.
      content: {application/json: {schema: {$ref: '#/components/schemas/PresaleAlertListEnvelope'}}}
    OwnerDirectoryList:
      description: Active internal users and their selectable application-authorized organization memberships.
      content: {application/json: {schema: {$ref: '#/components/schemas/OwnerDirectoryEnvelope'}}}
    Binary:
      description: Authorized binary stream; no JSON envelope on success.
      headers:
        Cache-Control: {schema: {type: string}}
        X-Content-Type-Options: {schema: {type: string}}
      content: {application/octet-stream: {schema: {type: string, contentEncoding: binary}}}
  requestBodies:
    EmptyJSON: {content: {application/json: {schema: {type: object, maxProperties: 0}}}}
    VersionedReason: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionedReason'}}}}
    ReasonOnly: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonOnly'}}}}
    CreateCustomer: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateCustomer'}}}}
    CreateOpportunity: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateOpportunity'}}}}
    StageChange: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageChange'}}}}
    PresaleCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PresaleCreate'}}}}
    ExternalStatusEvent: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExternalStatusEvent'}}}}
  x-operations:
    crmLive: {operationId: crmLive, tags: [Authentication], security: [], responses: {'200': {description: Process is alive}}}
    crmReady: {operationId: crmReady, tags: [Authentication], security: [], responses: {'200': {description: Ready for traffic}, '503': {description: Database is not ready}}}
    crmHealth: &publicGet {operationId: crmHealth, tags: [Authentication], security: [], responses: {'200': {description: Healthy}, '503': {description: Database unhealthy}}}
    crmLogin: {operationId: crmLogin, tags: [Authentication], security: [], parameters: [{name: return_to, in: query, schema: {type: string}}], responses: {'302': {description: Redirect to the platform authorization endpoint}, '400': {$ref: '#/components/responses/Error'}}}
    crmCallback: {operationId: crmCallback, tags: [Authentication], security: [], parameters: [{name: code, in: query, schema: {type: string}}, {name: state, in: query, schema: {type: string}}], responses: {'302': {description: Establish session and redirect}, '401': {$ref: '#/components/responses/Error'}}}
