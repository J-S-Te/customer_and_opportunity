name: customer-and-opportunity-ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-and-opportunity-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Validate CRM and Portal OpenAPI contracts
        run: go run ./cmd/openapi-check

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      crm_image_ref: ${{ steps.result.outputs.crm_image_ref }}
      portal_image_ref: ${{ steps.result.outputs.portal_image_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        shell: bash
        env:
          ACR_PUSH_REGISTRY: ${{ vars.ACR_PUSH_REGISTRY }}
          ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          : "${ACR_PUSH_REGISTRY:?missing ACR_PUSH_REGISTRY}"
          : "${ACR_PULL_REGISTRY:?missing ACR_PULL_REGISTRY}"
          : "${ACR_NAMESPACE:?missing ACR_NAMESPACE}"
          : "${ACR_REPOSITORY:?missing ACR_REPOSITORY}"
          echo "push_image=${ACR_PUSH_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "pull_image=${ACR_PULL_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_PUSH_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: crm
        uses: docker/build-push-action@v6
        with:
          context: .
          target: crm-runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.push_image }}:crm-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=customer-opportunity-crm
          cache-to: type=gha,mode=max,scope=customer-opportunity-crm
          provenance: true
          sbom: true
      - id: portal
        uses: docker/build-push-action@v6
        with:
          context: .
          target: portal-runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.push_image }}:portal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=customer-opportunity-portal
          cache-to: type=gha,mode=max,scope=customer-opportunity-portal
          provenance: true
          sbom: true
      - id: result
        shell: bash
        run: |
          echo "crm_image_ref=${{ steps.vars.outputs.pull_image }}@${{ steps.crm.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "portal_image_ref=${{ steps.vars.outputs.pull_image }}@${{ steps.portal.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: test
    steps:
      - name: Deploy immutable CRM and Portal images
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/basic-platform' }}
          DEPLOY_SCRIPT: ${{ vars.CUSTOMER_DEPLOY_SCRIPT || '/opt/basic-platform/bin/deploy-customer-opportunity.sh' }}
          CRM_IMAGE_REF: ${{ needs.image.outputs.crm_image_ref }}
          PORTAL_IMAGE_REF: ${{ needs.image.outputs.portal_image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_PATH" == /* ]] || { echo "DEPLOY_PATH must be absolute" >&2; exit 1; }
          [[ "$DEPLOY_SCRIPT" == /* ]] || { echo "CUSTOMER_DEPLOY_SCRIPT must be absolute" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command \
            'command -v bash >/dev/null && test -x %q && cd %q && bash %q %q %q' \
            "$DEPLOY_SCRIPT" "$DEPLOY_PATH" "$DEPLOY_SCRIPT" "$CRM_IMAGE_REF" "$PORTAL_IMAGE_REF"
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command"
